<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1f3a34">
  <title>Card</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 1rem; background: #1f3a34; font-family: system-ui, sans-serif; }
    .scene { width: min(100%, 26rem); aspect-ratio: 4 / 5; perspective: 75rem; }
    #card { position: relative; width: 100%; height: 100%; transform-style: preserve-3d; transition: transform .7s cubic-bezier(.4,.2,.2,1); cursor: pointer; }
    #card.flipped { transform: rotateY(180deg); }
    .face { position: absolute; inset: 0; display: grid; place-items: center; padding: 2rem; border-radius: 1.5rem; backface-visibility: hidden; text-align: center; overflow: auto; }
    .front { color: #1f3a34; background: linear-gradient(135deg,#fbf7f1,#efe4d4); }
    .back { color: #fbf7f1; background: #1f3a34; border: 2px solid #e3c58e; transform: rotateY(180deg); }
    .content { width: 100%; display: grid; gap: 1.25rem; }
    [data-field] { overflow-wrap: anywhere; }
    .hint { font-size: .85rem; opacity: .75; }
  </style>
</head>
<body>
  <main class="scene" aria-label="Card">
    <section id="card" role="button" tabindex="0" aria-label="Flip card">
      <div class="face front"><div class="content">
        <div data-field="brand"></div><h1 data-field="title"></h1><strong data-field="amount"></strong>
        <div data-field="subtitle"></div><div data-field="recipient"></div><div data-field="contact"></div>
        <div class="hint">Tap to flip</div>
      </div></div>
      <div class="face back"><div class="content">
        <h2 data-field="codeTitle"></h2><strong data-field="code"></strong><div data-field="instructions"></div>
        <div data-field="validUntil"></div><div data-field="terms"></div><div data-field="contact"></div>
      </div></div>
    </section>
  </main>
  <script>
    const WORKER_URL = 'https://certificate-worker.00-recall-coevals.workers.dev';
    const card = document.getElementById('card');
    let loaded = false;

    function setField(name, value) {
      document.querySelectorAll(`[data-field="${name}"]`).forEach((el) => { el.textContent = value ?? ''; });
    }

    async function loadCardData() {
      if (loaded) return;
      loaded = true;
      const initData = window.Telegram?.WebApp?.initData;
      if (!initData) {
        setField('code', 'Open this card through Telegram');
        return;
      }
      try {
        const response = await fetch(WORKER_URL, { headers: { Authorization: `tma ${initData}` } });
        if (!response.ok) throw new Error('Request failed');
        const data = await response.json();
        for (const [key, value] of Object.entries(data)) setField(key, value);
      } catch {
        setField('code', 'Unable to load card data');
      }
    }

    function flip() {
      card.classList.toggle('flipped');
      if (card.classList.contains('flipped')) {
        window.Telegram?.WebApp?.HapticFeedback?.impactOccurred?.('light');
        loadCardData();
      }
    }
    card.addEventListener('click', flip);
    card.addEventListener('keydown', (event) => {
      if (event.key === 'Enter' || event.key === ' ') { event.preventDefault(); flip(); }
    });
    window.Telegram?.WebApp?.ready();
    window.Telegram?.WebApp?.expand();
  </script>
</body>
</html>
